<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Apple touch icon — Rarify</title>
    <style>
      /* Rendered at exactly 180x180 by scripts/generate-og-image.ts.
         Full bleed: iOS applies its own corner mask, so there is no rounded
         rect and no border here — just the ring on the app background. */
      * {
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 180px;
        height: 180px;
        overflow: hidden;
        background: #030712;
      }

      svg {
        display: block;
        width: 180px;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#60a5fa" />
          <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
      </defs>
      <circle cx="16" cy="16" r="8" fill="none" stroke="#1e40af" stroke-width="4.2" />
      <path
        d="M 16 8 A 8 8 0 1 1 8 16"
        fill="none"
        stroke="url(#arc)"
        stroke-width="4.2"
        stroke-linecap="round"
      />
    </svg>
  </body>
</html>
