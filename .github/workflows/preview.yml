name: Preview

# Deploys pull requests to the shared preview stage
# (https://preview-rarify.georgejsuarez.com). Pushes to main deploy
# production instead — see release.yml.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Write env file
        run: |
          cat > .env.local <<'EOF'
          STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          PUBLIC_APP_URL=https://preview-rarify.georgejsuarez.com
          ENRICH_BATCH_SIZE=20
          EOF

      # Fork PRs have no secrets and can't deploy; everything else can.
      - name: Deploy preview stage
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        run: pnpm run alchemy:preview --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
