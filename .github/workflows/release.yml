name: Release

# Deploys pushes to main to production (https://rarify.georgejsuarez.com).
# Pull requests deploy the preview stage instead — see preview.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

      - name: Write env file
        run: |
          cat > .env.local <<'EOF'
          STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          PUBLIC_APP_URL=https://rarify.georgejsuarez.com
          ENRICH_BATCH_SIZE=20
          EOF

      - name: Deploy production stage
        run: pnpm run alchemy:release --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
