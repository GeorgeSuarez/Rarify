<!doctype html>
<html lang="en" class="dark h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track your Steam achievements and compare your progress with other players."
    />
    <meta name="theme-color" content="#030712" />
    <title>Rarify — Steam Achievement Dashboard</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The only publicly reachable screen is /login; the dashboard routes
         redirect anonymous visitors there. Keep this in step with
         public/sitemap.xml if a public route is ever added. -->
    <link rel="canonical" href="https://rarify.georgejsuarez.com/login" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- og-image.png and apple-touch-icon.png are generated by `npm run generate:og`;
         bump ?v= when the card changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rarify" />
    <meta property="og:url" content="https://rarify.georgejsuarez.com/login" />
    <meta property="og:title" content="Rarify — Steam Achievement Dashboard" />
    <meta
      property="og:description"
      content="Completion rates, rarity hunts, and perfect games — your Steam library turned into a collection worth showing off."
    />
    <meta property="og:image" content="https://rarify.georgejsuarez.com/og-image.png?v=1" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Rarify's achievement vault showing completion bars for Hades, Elden Ring, Baldur's Gate 3, and Hollow Knight."
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rarify — Steam Achievement Dashboard" />
    <meta
      name="twitter:description"
      content="Completion rates, rarity hunts, and perfect games — your Steam library turned into a collection worth showing off."
    />
    <meta name="twitter:image" content="https://rarify.georgejsuarez.com/og-image.png?v=1" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "https://rarify.georgejsuarez.com/#app",
            "name": "Rarify",
            "url": "https://rarify.georgejsuarez.com/",
            "description": "A Steam achievement dashboard for tracking completion rates, rarity, and perfect games across your library, and comparing progress with friends.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript and a public Steam profile.",
            "isAccessibleForFree": true,
            "inLanguage": "en",
            "image": "https://rarify.georgejsuarez.com/og-image.png",
            "sameAs": ["https://github.com/GeorgeSuarez/Rarify"],
            "author": { "@id": "https://georgejsuarez.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://georgejsuarez.com/#person",
            "name": "George Suarez",
            "url": "https://georgejsuarez.com/",
            "sameAs": ["https://github.com/georgesuarez", "https://linkedin.com/in/george-suarez"]
          },
          {
            "@type": "WebSite",
            "@id": "https://rarify.georgejsuarez.com/#website",
            "url": "https://rarify.georgejsuarez.com/",
            "name": "Rarify",
            "inLanguage": "en",
            "publisher": { "@id": "https://georgejsuarez.com/#person" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
